<script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('js')</script>
<meta name="theme-color" content="#040605">
<!-- Tab-Symbol klein, Apple-Touch-Symbol und og:image weiterhin in voller Größe -->
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="apple-touch-icon" href="/logo.png">
<!-- Vorschaubild fuer Social-Vorschauen. Zuvor lag hier das 500x500-Logo:
     Facebook, LinkedIn und WhatsApp erwarten 1200x630 und schneiden ein
     Quadrat entweder zu oder stellen es als winziges Beiwerk dar - auf 26
     Seiten dasselbe. Jetzt ein echtes 1200x630-Bild je Zweig, gebaut aus
     Logo, Wortmarke und dem Claim, der ohnehin im Fussbereich steht.
     og:image:alt ist Pflicht fuer Screenreader in sozialen Netzen. -->
<meta property="og:image" content="https://jungline.de/{{OG_BILD}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OG_BILD_ALT}}">
<meta property="og:locale" content="de_DE">
<!-- summary_large_image statt summary: mit einem echten 1200x630-Bild
     zeigt X/Twitter die grosse Karte, mit "summary" bliebe es bei einer
     kleinen quadratischen Miniatur. -->
<meta name="twitter:card" content="summary_large_image">
<meta name="author" content="Leandro Jung — JunglineLocal">
<!-- Nutzungsvorbehalt für Text und Data Mining (§ 44b Abs. 3 UrhG).
     "noai"/"noimageai" sind für Suchmaschinen unbekannte Direktiven und
     werden von ihnen folgenlos ignoriert — Indexierung und Ranking bleiben
     unberührt. "tdm-reservation" ist die dazu passende W3C-TDMRep-Angabe,
     ergänzt durch /.well-known/tdmrep.json und /ai.txt. -->
<meta name="robots" content="noai, noimageai">
<meta name="tdm-reservation" content="1">
<meta name="tdm-policy" content="https://jungline.de/nutzungsbedingungen/">
<meta name="copyright" content="© 2026 Leandro Jung / JunglineLocal — Alle Rechte vorbehalten">
<link rel="license" href="https://jungline.de/nutzungsbedingungen/">
<!-- Schriften lokal gehostet (DSGVO) — keine Verbindung zu Google-Servern -->
<link rel="preload" as="font" type="font/woff2" href="/fonts/bricolage-grotesque-var.woff2" crossorigin fetchpriority="high">
<link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-sans-var.woff2" crossorigin fetchpriority="high">
<!-- Frühzeitige Verbindung zum Kontaktformular. Die Terminbuchung läuft über
     die eigene Domain (/api/booking/) und braucht deshalb keinen Preconnect. -->
<link rel="dns-prefetch" href="//formspree.io">
<link rel="stylesheet" href="/src/css/site.css">
<!-- Attrappen und Illustrationen liegen ueberall unterhalb des sichtbaren
     Bereichs und muessen das Rendern nicht aufhalten. media="print" macht
     den Abruf nicht render-blockierend, onload haengt das Blatt danach
     regulaer ein. Ohne JavaScript greift das <noscript>-Blatt. -->
<link rel="stylesheet" href="/mockups.css?v={{MOCKUPS_V}}" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="/mockups.css?v={{MOCKUPS_V}}"></noscript>
