     (renderNav) pro Zweig aus src/data/zweige.js. Deshalb steht diese Datei
     nie so, wie sie hier liegt, im ausgelieferten HTML. -->
<a class="skip-link" href="#main">Zum Inhalt springen</a>
<nav class="nav" id="nav" data-zweig="{{ZWEIG}}">
  <div class="container nav__inner">
    <div class="nav__lead">
      <a href="{{BRAND_HREF}}" class="brand" aria-label="JunglineLocal — {{ZWEIG_KURZ}}">
        <span class="brand__tile"><img draggable="false" src="/logo-mark.png" alt="JunglineLocal Logo" width="160" height="171" decoding="async" fetchpriority="high"></span>
        <span class="brand__name">Jungline<b>Local</b></span>
      </a>
      {{SWITCH}}
    </div>
    <div class="nav__links">
      {{LINKS}}
    </div>
    <div class="nav__right">
      <a href="{{TERMIN_HREF}}" class="btn btn--primary nav__cta-desktop">Termin buchen</a>
      <button class="nav__toggle" id="navToggle" aria-label="Menü öffnen" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>
<div class="mobile-menu" id="mobileMenu">
  {{SWITCH_MOBILE}}
  {{MOBILE_LINKS}}
